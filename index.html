<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>—</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Cormorant+Unicase:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #2a2520;
      --paper: #f4ede0;
      --paper-deep: #ebe1cf;
      --whisper: rgba(42, 37, 32, 0.45);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Cormorant Garamond', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(180, 140, 90, 0.08), transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(120, 100, 70, 0.06), transparent 55%);
    }

    /* Subtle paper grain */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        repeating-radial-gradient(circle at 20% 30%, rgba(42, 37, 32, 0.015) 0, rgba(42, 37, 32, 0.015) 1px, transparent 1px, transparent 3px),
        repeating-radial-gradient(circle at 80% 70%, rgba(42, 37, 32, 0.02) 0, rgba(42, 37, 32, 0.02) 1px, transparent 1px, transparent 4px);
      pointer-events: none;
      z-index: 1;
    }

    /* Vignette */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(42, 37, 32, 0.12) 100%);
      pointer-events: none;
      z-index: 2;
    }

    .stage {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 2rem;
      max-width: 720px;
    }

    .ornament {
      font-family: 'Cormorant Unicase', serif;
      font-size: 1.5rem;
      color: var(--whisper);
      letter-spacing: 0.8em;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fade-in 2s ease-out 0.3s forwards;
    }

    .ornament span {
      display: inline-block;
    }

    blockquote {
      font-size: clamp(1.75rem, 4.5vw, 3.25rem);
      font-weight: 300;
      line-height: 1.25;
      letter-spacing: 0.005em;
      font-style: italic;
      position: relative;
    }

    blockquote .word {
      display: inline-block;
      opacity: 0;
      transform: translateY(0.4em);
      animation: rise 1.4s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    /* Stagger words */
    .word:nth-child(1) { animation-delay: 0.8s; }
    .word:nth-child(2) { animation-delay: 1.0s; }
    .word:nth-child(3) { animation-delay: 1.2s; }
    .word:nth-child(4) { animation-delay: 1.4s; }
    .word:nth-child(5) { animation-delay: 1.6s; }
    .word:nth-child(6) { animation-delay: 1.8s; }
    .word:nth-child(7) { animation-delay: 2.0s; }
    .word:nth-child(8) { animation-delay: 2.2s; }
    .word:nth-child(9) { animation-delay: 2.4s; }

    .attribution {
      margin-top: 3rem;
      font-size: 0.85rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--whisper);
      opacity: 0;
      animation: fade-in 2s ease-out 3s forwards;
    }

    .attribution::before,
    .attribution::after {
      content: "—";
      margin: 0 1rem;
      opacity: 0.6;
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-in {
      to { opacity: 1; }
    }

    /* Slow breathing on the ornament */
    @keyframes breathe {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.7; }
    }

    .ornament.breathing {
      animation: breathe 6s ease-in-out infinite;
    }

    @media (max-width: 600px) {
      .ornament { font-size: 1.1rem; letter-spacing: 0.6em; margin-bottom: 2rem; }
      blockquote { font-size: 1.6rem; }
      .attribution { font-size: 0.7rem; letter-spacing: 0.3em; }
      .attribution::before, .attribution::after { margin: 0 0.5rem; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="ornament" id="ornament">
      <span>·</span><span>&nbsp;&nbsp;</span><span>◦</span><span>&nbsp;&nbsp;</span><span>·</span>
    </div>

    <blockquote>
      <span class="word">Abandon</span>
      <span class="word">knowledge</span>
      <span class="word">and</span>
      <span class="word">your</span>
      <span class="word">worries</span>
      <span class="word">are</span>
      <span class="word">over.</span>
    </blockquote>

    <div class="attribution">Lao Tzu</div>
  </main>

  <script>
    // After the entrance animation, let the ornament breathe gently
    setTimeout(() => {
      document.getElementById('ornament').classList.add('breathing');
    }, 2300);
  </script>
</body>
</html>
